name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.8
  # Model Whisper khusus bacaan Al-Qur'an, dikonversi ke GGML untuk whisper.cpp.
  HF_MODEL: tarteel-ai/whisper-base-ar-quran
  MODEL_KEY: ggml-quran-base-q5_1-v3
  # Silero VAD untuk memotong jeda diam sebelum pengenalan suara.
  VAD_FILE: ggml-silero-v5.1.2.bin

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@v4
        id: cache
        with:
          path: model/ggml-quran.bin
          key: ${{ env.MODEL_KEY }}

      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.11'

      - name: Unduh model dan alat konversi
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet transformers huggingface_hub numpy
          # Samakan versi dengan whisper.cpp di paket whisper_ggml.
          git clone --depth 1 --branch v1.9.1 https://github.com/ggml-org/whisper.cpp \
            || git clone --depth 1 https://github.com/ggml-org/whisper.cpp
          git clone --depth 1 https://github.com/openai/whisper openai-whisper
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download, hf_hub_download
          d = snapshot_download(os.environ['HF_MODEL'], local_dir='hf-model')
          # Konverter butuh berkas tokenizer; ambil dari model dasar bila tidak ada.
          for f in ['vocab.json', 'added_tokens.json']:
              if not os.path.exists(os.path.join(d, f)):
                  hf_hub_download('openai/whisper-base', f, local_dir=d)
          # Konverter memakai max_length sebagai n_text_ctx; model ini menyimpan
          # 1024 di sana padahal positional embedding decoder berukuran 448,
          # sehingga whisper.cpp menolak memuat model. Samakan.
          import json
          cfg_path = os.path.join(d, 'config.json')
          cfg = json.load(open(cfg_path))
          print('max_length', cfg.get('max_length'), 'max_target_positions', cfg.get('max_target_positions'))
          cfg['max_length'] = cfg['max_target_positions']
          json.dump(cfg, open(cfg_path, 'w'), indent=2)
          PY
          echo '--- Kartu model (cek lisensi) ---'
          head -n 40 hf-model/README.md || true
          ls -la hf-model

      - name: Konversi ke GGML dan kuantisasi
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p out model
          python whisper.cpp/models/convert-h5-to-ggml.py hf-model openai-whisper out
          ls -la out
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build whisper.cpp/build -j --config Release --target whisper-quantize whisper-cli
          whisper.cpp/build/bin/whisper-quantize out/ggml-model.bin model/ggml-quran.bin q5_1
          ls -la model
          # Pastikan model bisa dimuat dan dijalankan oleh whisper.cpp v1.9.1.
          whisper.cpp/build/bin/whisper-cli -m model/ggml-quran.bin -f whisper.cpp/samples/jfk.wav -l ar -nt

      - uses: actions/cache@v4
        id: vadcache
        with:
          path: model/ggml-vad.bin
          key: vad-${{ env.VAD_FILE }}-v1

      - name: Unduh dan uji model VAD
        if: steps.vadcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p model
          curl -fL --retry 3 -o model/ggml-vad.bin \
            "https://huggingface.co/ggml-org/whisper-vad/resolve/main/$VAD_FILE"
          ls -la model
          if [ ! -d whisper.cpp ]; then
            git clone --depth 1 --branch v1.9.1 https://github.com/ggml-org/whisper.cpp
          fi
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build whisper.cpp/build -j --config Release --target whisper-cli
          # Pastikan model Qur'an + VAD berjalan bersama di whisper.cpp v1.9.1.
          whisper.cpp/build/bin/whisper-cli -m model/ggml-quran.bin -f whisper.cpp/samples/jfk.wav \
            -l ar -nt --vad -vm model/ggml-vad.bin

      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: |
            model/ggml-quran.bin
            model/ggml-vad.bin
          retention-days: 3

  apk:
    needs: model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - uses: actions/download-artifact@v4
        with:
          name: model
          path: assets/model

      - name: Terima lisensi Android SDK dan pasang NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          # NDK yang diminta plugin whisper_ggml.
          "$SDKM" --install "ndk;29.0.13113456" > /dev/null

      - name: Siapkan kunci tanda tangan
        env:
          KEYSTORE_B64: ${{ secrets.TARTIL_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TARTIL_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Secret TARTIL_KEYSTORE_B64 belum ada, APK memakai kunci debug (pembaruan perlu hapus aplikasi lama)."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/tartil.jks
          cat > android/key.properties <<PROPS
          storeFile=tartil.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=tartil
          keyPassword=$KEYSTORE_PASSWORD
          PROPS

      - name: Build APK (arm64)
        run: |
          ls -la assets/model
          flutter build apk --release --target-platform android-arm64
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/tartil-arm64.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: tartil-apk
          path: dist/tartil-arm64.apk

      - name: Terbitkan rilis (unduh dari HP)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Tartil build ${{ github.run_number }}
          body: |
            APK Tartil dari commit ${{ github.sha }}.
            Unduh `tartil-arm64.apk` di HP Android, lalu pasang.
          files: dist/tartil-arm64.apk
